name: build-billions

# Manual build of the Billions bridge UI from the long-lived
# billions-mainnet-custom branch. The image tag is immutable: pick a new version for
# every build (suggested scheme: <generic version this branch is rebased
# on>-<n>, e.g. billions-mainnet-1.1.26-1).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version suffix; the image is tagged zkevm-bridge-ui-generic:billions-mainnet-<version>"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout billions-mainnet-custom
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: billions-mainnet-custom

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the Billions image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # Build from the checked-out billions-mainnet-custom workspace; without this the
          # action defaults to the Git context at the workflow's run ref.
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            gatewayfm/zkevm-bridge-ui-generic:billions-mainnet-${{ inputs.version }}
